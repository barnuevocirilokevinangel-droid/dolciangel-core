<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" width="100%" height="100%">
  <defs>
    <!-- Filtros de sombra y profundidad -->
    <filter id="cakeDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#78350F" flood-opacity="0.32" />
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#451A03" flood-opacity="0.22" />
    </filter>
    <filter id="coulisGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#D97706" flood-opacity="0.4" />
    </filter>

    <!-- Gradientes Base Crocante -->
    <linearGradient id="crustSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2884A" />
      <stop offset="50%" stop-color="#9C5A23" />
      <stop offset="100%" stop-color="#6E3812" />
    </linearGradient>
    <linearGradient id="crustBack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D49B5B" />
      <stop offset="100%" stop-color="#8F4B18" />
    </linearGradient>

    <!-- Gradientes Crema Cheesecake -->
    <linearGradient id="creamSide" x1="20%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#FFFFF7" />
      <stop offset="25%" stop-color="#FFFDF0" />
      <stop offset="70%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
    <linearGradient id="creamFront" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>

    <!-- Gradientes Coulis de Maracuyá -->
    <linearGradient id="coulisTop" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="75%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="coulisGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="dripGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="85%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
  </defs>

  <g filter="url(#cakeDropShadow)">
    <!-- Base crocante de galleta (Borde posterior curvado) -->
    <path d="M 110,210 C 230,170 380,210 430,240 L 430,285 C 380,255 230,215 110,255 Z" fill="url(#crustBack)" />

    <!-- Relleno cremoso de queso (Caras 3D de la porción) -->
    <!-- Cara posterior izquierda -->
    <path d="M 110,210 L 255,345 L 255,270 L 110,140 Z" fill="url(#creamSide)" opacity="0.95" />
    
    <!-- Cara frontal derecha -->
    <path d="M 255,345 L 430,285 L 430,205 L 255,270 Z" fill="url(#creamFront)" />

    <!-- Base crocante (Cara frontal) -->
    <path d="M 110,245 L 255,375 L 430,315 L 430,285 L 255,345 L 110,215 Z" fill="url(#crustSide)" />
    <!-- Textura granulada de la galleta -->
    <ellipse cx="200" cy="315" rx="3" ry="1.5" fill="#582C0E" opacity="0.6"/>
    <ellipse cx="240" cy="355" rx="2.5" ry="1.2" fill="#FEF3C7" opacity="0.8"/>
    <ellipse cx="310" cy="335" rx="3" ry="1.5" fill="#582C0E" opacity="0.6"/>
    <ellipse cx="370" cy="310" rx="2" ry="1" fill="#FEF3C7" opacity="0.8"/>

    <!-- Cara superior del Cheesecake (Capa superior de crema) -->
    <path d="M 110,140 L 255,270 L 430,205 C 380,175 230,135 110,140 Z" fill="#FFFBEB" />

    <!-- COULIS DE MARACUYÁ FLUIDO (Capa superior brillante) -->
    <path d="M 115,142 C 220,138 370,175 425,206 C 390,225 350,235 305,250 C 270,262 255,270 255,270 L 115,142 Z" 
          fill="url(#coulisTop)" filter="url(#coulisGlow)" />

    <!-- Brillos especulares en el coulis -->
    <path d="M 135,150 C 220,146 320,172 385,198 C 340,210 280,215 220,200 C 170,185 140,165 135,150 Z" 
          fill="url(#coulisGloss)" opacity="0.75" />

    <!-- Gotas y goteo artesanal de coulis por los lados -->
    <!-- Gota frontal izquierda -->
    <path d="M 220,240 C 220,270 226,290 223,300 C 220,310 212,310 210,300 C 208,285 212,260 212,233 Z" fill="url(#dripGrad)" />
    <!-- Gota en la punta frontal -->
    <path d="M 250,265 C 250,285 258,305 256,325 C 254,338 244,338 243,322 C 242,305 246,285 245,260 Z" fill="url(#dripGrad)" />
    <!-- Gota derecha -->
    <path d="M 330,242 C 330,265 338,280 336,292 C 334,302 325,302 324,290 C 323,275 325,255 324,244 Z" fill="url(#dripGrad)" />
    <path d="M 380,222 C 382,240 388,252 387,260 C 385,268 378,268 377,258 C 376,248 376,232 376,224 Z" fill="url(#dripGrad)" />

    <!-- Semillas negras reales de maracuyá en el coulis -->
    <g fill="#1F160C">
      <!-- Semilla 1 -->
      <ellipse cx="200" cy="175" rx="8" ry="4" transform="rotate(-25 200 175)"/>
      <ellipse cx="199" cy="174" rx="3" ry="1.5" fill="#FDE68A" opacity="0.7"/>
      <!-- Semilla 2 -->
      <ellipse cx="260" cy="205" rx="9" ry="4.5" transform="rotate(15 260 205)"/>
      <ellipse cx="259" cy="204" rx="3.5" ry="1.8" fill="#FDE68A" opacity="0.7"/>
      <!-- Semilla 3 -->
      <ellipse cx="320" cy="225" rx="7.5" ry="3.8" transform="rotate(-40 320 225)"/>
      <ellipse cx="319" cy="224" rx="3" ry="1.4" fill="#FDE68A" opacity="0.7"/>
      <!-- Semilla 4 -->
      <ellipse cx="360" cy="205" rx="7" ry="3.5" transform="rotate(30 360 205)"/>
      <ellipse cx="359" cy="204" rx="2.5" ry="1.2" fill="#FDE68A" opacity="0.7"/>
      <!-- Semilla en gota -->
      <ellipse cx="249" cy="310" rx="5" ry="3" transform="rotate(80 249 310)"/>
    </g>

    <!-- Hojas de menta fresca en el tope -->
    <g transform="translate(160, 110) rotate(-15)">
      <!-- Hoja 1 -->
      <path d="M 0,25 C 20,5 50,0 70,10 C 65,35 45,55 0,25 Z" fill="#15803D" />
      <path d="M 0,25 C 25,12 50,10 70,10" stroke="#86EFAC" stroke-width="1.8" fill="none" opacity="0.7"/>
      <!-- Hoja 2 -->
      <path d="M 10,28 C -10,12 -35,15 -50,30 C -40,50 -20,60 10,28 Z" fill="#16A34A" />
      <path d="M 10,28 C -15,22 -35,22 -50,30" stroke="#BBF7D0" stroke-width="1.5" fill="none" opacity="0.7"/>
    </g>
  </g>
</svg>
