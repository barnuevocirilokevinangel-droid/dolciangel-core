<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="passionSkin" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#9A3412"/>
      <stop offset="60%" stop-color="#7C2D12"/>
      <stop offset="100%" stop-color="#431407"/>
    </radialGradient>
    <radialGradient id="passionPulp" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="45%" stop-color="#F59E0B"/>
      <stop offset="85%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </radialGradient>
    <filter id="satDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#satDrop)">
    <!-- Cáscara exterior -->
    <circle cx="50" cy="50" r="42" fill="url(#passionSkin)"/>
    <circle cx="50" cy="50" r="37" fill="#FEF3C7"/>
    <!-- Pulpa interior brillante -->
    <circle cx="50" cy="50" r="33" fill="url(#passionPulp)"/>
    <!-- Semillas negras con aureola -->
    <ellipse cx="40" cy="40" rx="5" ry="3" fill="#1C1917" transform="rotate(20 40 40)"/>
    <ellipse cx="60" cy="45" rx="5.5" ry="3" fill="#1C1917" transform="rotate(-35 60 45)"/>
    <ellipse cx="48" cy="62" rx="5" ry="3" fill="#1C1917" transform="rotate(50 48 62)"/>
    <ellipse cx="36" cy="55" rx="4.5" ry="2.5" fill="#1C1917" transform="rotate(-15 36 55)"/>
    <ellipse cx="58" cy="35" rx="4" ry="2.2" fill="#1C1917" transform="rotate(45 58 35)"/>
    <!-- Brillo jugoso -->
    <ellipse cx="44" cy="36" rx="6" ry="3" fill="#FFF" opacity="0.6"/>
  </g>
</svg>
