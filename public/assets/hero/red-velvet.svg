<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" width="100%" height="100%">
  <defs>
    <!-- Filtros de sombra y profundidad -->
    <filter id="velvetDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#881337" flood-opacity="0.32" />
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#4C0519" flood-opacity="0.22" />
    </filter>
    <filter id="frostingGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#BE123C" flood-opacity="0.25" />
    </filter>

    <!-- Gradientes Bizcocho Red Velvet Carmesí -->
    <linearGradient id="redSponge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BE123C" />
      <stop offset="45%" stop-color="#9F1239" />
      <stop offset="85%" stop-color="#881337" />
      <stop offset="100%" stop-color="#4C0519" />
    </linearGradient>

    <!-- Gradiente Frosting de Queso Crema Blanco Sedoso -->
    <linearGradient id="frostingWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FFFDF5" />
      <stop offset="80%" stop-color="#FDF4E7" />
      <stop offset="100%" stop-color="#FCE7D0" />
    </linearGradient>

    <!-- Gradientes Fresa Ruby -->
    <radialGradient id="strawberryGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="40%" stop-color="#E11D48" />
      <stop offset="85%" stop-color="#9F1239" />
      <stop offset="100%" stop-color="#4C0519" />
    </radialGradient>
    
    <!-- Gradiente Arándano -->
    <radialGradient id="blueberryGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="35%" stop-color="#4338CA" />
      <stop offset="80%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F0C29" />
    </radialGradient>
  </defs>

  <g filter="url(#velvetDropShadow)">
    <!-- Borde posterior curvado de la torta -->
    <path d="M 110,210 C 230,170 380,210 430,240 L 430,285 C 380,255 230,215 110,255 Z" fill="#4C0519" />

    <!-- Capa 1 Bizcocho Red Velvet (Inferior) -->
    <path d="M 110,210 L 255,345 L 255,315 L 110,180 Z" fill="url(#redSponge)" />
    <path d="M 255,345 L 430,285 L 430,255 L 255,315 Z" fill="url(#redSponge)" opacity="0.95" />

    <!-- Capa 1 Frosting Queso Crema Centro -->
    <path d="M 110,180 L 255,315 L 255,295 L 110,160 Z" fill="url(#frostingWhite)" />
    <path d="M 255,315 L 430,255 L 430,235 L 255,295 Z" fill="url(#frostingWhite)" />

    <!-- Capa 2 Bizcocho Red Velvet (Media) -->
    <path d="M 110,160 L 255,295 L 255,265 L 110,130 Z" fill="url(#redSponge)" />
    <path d="M 255,295 L 430,235 L 430,205 L 255,265 Z" fill="url(#redSponge)" opacity="0.95" />

    <!-- Capa 2 Frosting Queso Crema Superior -->
    <path d="M 110,130 L 255,265 L 255,245 L 110,110 Z" fill="url(#frostingWhite)" />
    <path d="M 255,265 L 430,205 L 430,185 L 255,245 Z" fill="url(#frostingWhite)" />

    <!-- Capa 3 Bizcocho Red Velvet (Superior) -->
    <path d="M 110,110 L 255,245 L 255,220 L 110,85 Z" fill="url(#redSponge)" />
    <path d="M 255,245 L 430,185 L 430,160 L 255,220 Z" fill="url(#redSponge)" opacity="0.9" />

    <!-- Base 3D -->
    <path d="M 110,245 L 255,380 L 430,320 L 430,285 L 255,345 L 110,210 Z" fill="#380412" />

    <!-- COBERTURA SUPERIOR FROSTING NUBOSO CREMA (Swirls) -->
    <path d="M 110,85 L 255,220 L 430,160 C 380,130 230,85 110,85 Z" fill="url(#frostingWhite)" filter="url(#frostingGlow)" />

    <!-- Relieves ondulados del frosting artesanal -->
    <path d="M 125,92 C 160,85 195,110 220,105 C 255,100 290,125 320,120 C 360,115 390,140 415,150 C 370,165 320,168 270,158 C 220,148 170,125 125,92 Z" 
          fill="#FFFFFF" opacity="0.8" />
    <path d="M 150,110 C 180,105 210,125 240,120 C 280,115 310,135 340,130 C 370,125 390,145 400,152" 
          stroke="#F8E7D8" stroke-width="3" fill="none" opacity="0.6"/>

    <!-- Lluvia de migas terciopelo rojo (Red Velvet Crumbles) -->
    <g fill="#BE123C">
      <circle cx="150" cy="115" r="3"/>
      <circle cx="185" cy="100" r="2.5"/>
      <circle cx="215" cy="130" r="3.5"/>
      <circle cx="280" cy="120" r="3"/>
      <circle cx="325" cy="140" r="2.8"/>
      <circle cx="365" cy="135" r="3.2"/>
      <circle cx="395" cy="148" r="2"/>
      <circle cx="245" cy="235" r="2.5"/>
      <circle cx="252" cy="305" r="2.8"/>
    </g>

    <!-- Fresa fresca glaseada con hojas verdes -->
    <g transform="translate(245, 60)">
      <!-- Sombra fresa -->
      <ellipse cx="25" cy="50" rx="20" ry="7" fill="#000000" opacity="0.35"/>
      <!-- Cuerpo fresa -->
      <path d="M 25,12 C 45,15 52,38 42,56 C 34,70 25,76 25,76 C 25,76 16,70 8,56 C -2,38 5,15 25,12 Z" fill="url(#strawberryGrad)"/>
      <!-- Brillo fresa -->
      <path d="M 16,20 C 22,18 28,20 28,28 C 28,38 20,44 14,38 C 10,34 10,24 16,20 Z" fill="#FFFFFF" opacity="0.45"/>
      <!-- Semillas doradas de la fresa -->
      <circle cx="20" cy="32" r="1.5" fill="#FEF08A"/>
      <circle cx="32" cy="32" r="1.5" fill="#FEF08A"/>
      <circle cx="25" cy="42" r="1.5" fill="#FEF08A"/>
      <circle cx="16" cy="46" r="1.5" fill="#FEF08A"/>
      <circle cx="34" cy="46" r="1.5" fill="#FEF08A"/>
      <circle cx="25" cy="56" r="1.2" fill="#FEF08A"/>
      <!-- Hojas corona de la fresa -->
      <path d="M 25,14 C 18,5 8,4 2,8 C 10,12 18,16 25,14 Z" fill="#16A34A"/>
      <path d="M 25,14 C 32,5 42,4 48,8 C 40,12 32,16 25,14 Z" fill="#15803D"/>
      <path d="M 25,14 C 23,2 27,2 25,14 Z" stroke="#166534" stroke-width="2"/>
    </g>

    <!-- Arándanos silvestres junto a la fresa -->
    <g transform="translate(195, 115)">
      <circle cx="15" cy="15" r="13" fill="url(#blueberryGrad)"/>
      <ellipse cx="15" cy="6" rx="4" ry="2" fill="#312E81"/>
      <circle cx="11" cy="11" r="3.5" fill="#A5B4FC" opacity="0.5"/>
    </g>
    <g transform="translate(310, 125)">
      <circle cx="14" cy="14" r="11" fill="url(#blueberryGrad)"/>
      <ellipse cx="14" cy="6" rx="3.5" ry="1.8" fill="#312E81"/>
      <circle cx="10" cy="10" r="3" fill="#A5B4FC" opacity="0.5"/>
    </g>
  </g>
</svg>
