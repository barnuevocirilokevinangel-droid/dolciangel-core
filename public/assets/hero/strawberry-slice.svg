<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="strawbSkin" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FDA4AF"/>
      <stop offset="30%" stop-color="#F43F5E"/>
      <stop offset="75%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#9F1239"/>
    </radialGradient>
    <filter id="strawbShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#881337" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#strawbShadow)" transform="translate(10, 5) rotate(15 40 40)">
    <!-- Pulpa corazón -->
    <path d="M 40,15 C 65,18 75,45 60,68 C 50,82 40,88 40,88 C 40,88 30,82 20,68 C 5,45 15,18 40,15 Z" fill="url(#strawbSkin)"/>
    <!-- Centro blanco de la rebanada -->
