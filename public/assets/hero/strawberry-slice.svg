    <!-- Vetas rojas del centro -->
    <path d="M 40,32 L 40,65 M 36,40 L 26,45 M 44,40 L 54,45 M 37,50 L 29,56 M 43,50 L 51,56" stroke="#FB7185" stroke-width="2" stroke-linecap="round"/>
    <!-- Semillas en el contorno -->
    <circle cx="22" cy="38" r="1.8" fill="#FEF08A"/>
    <circle cx="58" cy="38" r="1.8" fill="#FEF08A"/>
    <circle cx="28" cy="58" r="1.8" fill="#FEF08A"/>
    <circle cx="52" cy="58" r="1.8" fill="#FEF08A"/>
  </g>
</svg>
