const log = document.getElementById('log');

function agregarLog(msg, tipo='info') {
  const div = document.createElement('div');
  div.className = tipo;
  div.textContent = msg;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

window.subirClientes = async function() {
  agregarLog('🚀 Iniciando subida de clientes...', 'info');
  let exitosos = 0;
  let errores = 0;

  for (let i = 0; i < clientes.length; i++) {
    const c = clientes[i];
    try {
      const id = c.nombre.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');
      await setDoc(doc(db, 'clientes', id), {
        nombre: c.nombre,
        telefono: c.telefono,
        cumpleanos: c.cumpleanos,
        puntos: c.puntos,
        fechaRegistro: new Date().toISOString(),
        historialPuntos: []
      });
      exitosos++;
      agregarLog(`✅ ${i+1}/${clientes.length} - ${c.nombre} (${c.puntos} pts)`, 'ok');
      progreso.textContent = `Subiendo... ${i+1}/${clientes.length}`;
    } catch(e) {
      errores++;
      agregarLog(`❌ Error con ${c.nombre}: ${e.message}`, 'err');
    }
    await new Promise(r => setTimeout(r, 100));
  }

  progreso.textContent = `✅ Completado: ${exitosos} subidos, ${errores} errores`;
  agregarLog(`\n🎉 LISTO: ${exitosos} clientes subidos a Firebase`, 'ok');
}
